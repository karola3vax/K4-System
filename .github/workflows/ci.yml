name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: k4test
          MYSQL_DATABASE: k4test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pk4test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      K4_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=k4test;Database=k4test;SslMode=None;AllowPublicKeyRetrieval=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore K4-System.Tests/K4-System.Tests.csproj --locked-mode
      - run: dotnet format K4-System.Tests/K4-System.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet test K4-System.Tests/K4-System.Tests.csproj --configuration Release --no-restore
      - run: dotnet build K4-System/src/K4-System.csproj --configuration Release --no-restore -warnaserror
      - name: Check the package contents
        run: |
          P=K4-System/src/bin/K4-System
          for f in plugins/K4-System/K4-System.dll plugins/K4-System/MaxMind.GeoIP2.dll plugins/K4-System/MaxMind.Db.dll \
                   plugins/K4-System/K4-System.deps.json plugins/K4-System/Microsoft.Data.Sqlite.dll \
                   plugins/K4-System/runtimes/linux-x64/native/libe_sqlite3.so plugins/K4-System/runtimes/win-x64/native/e_sqlite3.dll \
                   shared/K4-SharedApi/K4-SharedApi.dll; do
            test -f "$P/$f" || { echo "Missing $f" >&2; exit 1; }
          done

  # A version tag (vX.Y.Z) builds the zip and publishes the GitHub release. A release that already exists is left alone,
  # so re-running a tag never uploads a second, different zip.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Skip when the release already exists
        id: exists
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing is uploaded."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and package
        if: steps.exists.outputs.skip != 'true'
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -Fq "ModuleVersion => \"${VERSION} " K4-System/src/Plugin.cs
          grep -Eq "^-- [0-9]{4}\.[0-9]{2}\.[0-9]{2} - V${VERSION}$" CHANGELOG

          dotnet restore K4-System.Tests/K4-System.Tests.csproj --locked-mode
          dotnet build K4-System/src/K4-System.csproj --configuration Release --no-restore --nologo -warnaserror

          P=K4-System/src/bin/K4-System
          for f in plugins/K4-System/K4-System.dll plugins/K4-System/Dapper.dll plugins/K4-System/MySqlConnector.dll \
                   plugins/K4-System/K4-System.deps.json plugins/K4-System/Microsoft.Data.Sqlite.dll plugins/K4-System/SQLitePCLRaw.core.dll \
                   plugins/K4-System/SQLitePCLRaw.provider.e_sqlite3.dll plugins/K4-System/runtimes/linux-x64/native/libe_sqlite3.so \
                   plugins/K4-System/runtimes/win-x64/native/e_sqlite3.dll plugins/K4-System/MaxMind.GeoIP2.dll \
                   plugins/K4-System/MaxMind.Db.dll shared/K4-SharedApi/K4-SharedApi.dll; do
            test -f "$P/$f" || { echo "Missing $f" >&2; exit 1; }
          done
          test "$(find "$P/plugins/K4-System/lang" -maxdepth 1 -type f -name '*.json' | wc -l)" -ge 13
          if find "$P" -type f | grep -Eq 'MMRanks|FakeRanks'; then
            echo "Release package contains an old companion plugin." >&2
            exit 1
          fi

          ZIP="K4-System-v${VERSION}.zip"
          (cd "$P" && zip -qr "$GITHUB_WORKSPACE/$ZIP" .)
          SHA="$(sha256sum "$ZIP" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          printf '%s  %s\n' "$SHA" "$ZIP" > "$ZIP.sha256"

          awk -v version="$VERSION" '
            index($0, " - V" version) > 0 && substr($0, 1, 3) == "-- " { capture = 1; next }
            capture && substr($0, 1, 3) == "-- " { exit }
            capture { print }
          ' CHANGELOG > release-notes.md
          test -s release-notes.md
          printf '\nPackage SHA-256: `%s`\n' "$SHA" >> release-notes.md

          gh release create "$RELEASE_TAG" "$ZIP" "$ZIP.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "K4-System $RELEASE_TAG" --notes-file release-notes.md --verify-tag
